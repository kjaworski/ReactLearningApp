services:
  postgres:
    image: postgres:16
    container_name: finance-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_dev
      POSTGRES_DB: finance_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: